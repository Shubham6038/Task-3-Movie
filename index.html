<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlavorFinder | Recipe Web App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-animation"></div>

    <header>
        <div class="logo" id="logo-btn">Recipe Finder</div>
        <nav>
            <button id="home-btn" class="nav-btn active">Home</button>
            <button id="fav-btn" class="nav-btn">Favorites</button>
            <button id="random-btn" class="surprise-btn">Surprise Me</button>
        </nav>
    </header>

    <main>
        <section class="controls-section" id="controls-sec">
            <div class="search-box">
                <input type="text" id="search-input" placeholder="Search your favorite recipe...">
                <button id="search-btn">Search</button>
            </div>
            <div class="filters">
                <select id="category-select">
                    <option value="">All Categories</option>
                </select>
                <select id="diet-select">
                    <option value="">All Diets (Veg/Non-Veg)</option>
                  <option value="veg">Pure Veg / Vegan</option>
                     <option value="non-veg">Non-Vegetarian</option>
                </select>
                <select id="area-select">
                    <option value="">All Cuisines</option>
                </select>
            </div>
        </section>

        <h2 class="section-title" id="page-title">Latest Recipes</h2>
        <div class="recipe-grid" id="recipe-display">
            </div>

        <div class="modal" id="recipe-modal">
            <div class="modal-content">
                <span class="close-btn" id="close-modal">&times;</span>
                <div id="modal-body">
                    </div>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
